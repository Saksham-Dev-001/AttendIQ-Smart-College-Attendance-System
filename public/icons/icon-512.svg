<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="50%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner border ring -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4" />

  <!-- Central Emblem -->
  <g transform="translate(0, -10)">
    <!-- Scanning radar arcs -->
    <path d="M 176 180 A 100 100 0 0 1 336 180" fill="none" stroke="#a5b4fc" stroke-width="8" stroke-linecap="round" stroke-opacity="0.4" />
    <path d="M 144 150 A 140 140 0 0 1 368 150" fill="none" stroke="#a5b4fc" stroke-width="8" stroke-linecap="round" stroke-opacity="0.25" />

    <!-- Graduation Cap Symbol -->
    <path d="M 256 160 L 416 230 L 256 300 L 96 230 Z" fill="url(#capGrad)" filter="url(#glow)" />
    <path d="M 160 260 L 160 330 C 160 365 200 395 256 395 C 312 395 352 365 352 330 L 352 260 L 256 302 Z" fill="#e0e7ff" />
    
    <!-- Tassel -->
    <path d="M 400 240 L 400 330" stroke="#fcd34d" stroke-width="8" stroke-linecap="round" />
    <circle cx="400" cy="336" r="10" fill="#fbbf24" />

    <!-- AIQ Badge -->
    <rect x="186" y="405" width="140" height="38" rx="19" fill="#1e1b4b" fill-opacity="0.6" stroke="#c7d2fe" stroke-width="2" />
    <text x="256" y="430" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="3">ATTENDIQ</text>
  </g>
</svg>

